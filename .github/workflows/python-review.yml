name: Revisão de código Python (pós-merge)

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # comentário no commit
      pull-requests: write  # comentário no PR associado (se existir)
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-review.txt

      - name: Instalar ferramentas de revisão
        run: pip install -r scripts/requirements-review.txt

      - name: Executar revisão
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPORT_PATH: review_report.md
          FAIL_ON_ERRORS: "false"
        run: python scripts/review.py

      - name: Comentar no commit
        if: always() && hashFiles('review_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@review_report.md

      - name: Comentar no PR associado (se houver)
        if: always() && hashFiles('review_report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@review_report.md
          fi
